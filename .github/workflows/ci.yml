name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e build
    # Versão fixa da imagem do runner (o Mongo é tratado no passo "Subir o Mongo").
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URI: mongodb://localhost:27017/corewallet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # O Mongo sobe por script, e não como "service": precisa ser réplica (transações) e, se o Mongo 8 não
      # iniciar neste kernel, cai para o 7.0. Veja .github/scripts/subir-mongo.sh.
      - name: Subir o Mongo (réplica)
        run: .github/scripts/subir-mongo.sh
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Testes de ponta a ponta
    # Versão fixa da imagem do runner (o Mongo é tratado no passo "Subir o Mongo").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # O Mongo sobe por script, e não como "service": precisa ser réplica (transações) e, se o Mongo 8 não
      # iniciar neste kernel, cai para o 7.0. Veja .github/scripts/subir-mongo.sh.
      - name: Subir o Mongo (réplica)
        run: .github/scripts/subir-mongo.sh
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guardar os traços dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7

  docker:
    name: Imagens Docker
    # Versão fixa da imagem do runner (o Mongo é tratado no passo "Subir o Mongo").
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: |
          cp .env.example .env
          # as senhas do exemplo ficam vazias de propósito; no CI geramos valores descartáveis
          sed -i "s/^MONGO_ROOT_PASSWORD=.*/MONGO_ROOT_PASSWORD=$(openssl rand -hex 16)/; s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 48)/" .env
          docker compose build
