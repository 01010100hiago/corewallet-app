name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      TEST_DATABASE_URI: mongodb://localhost:27017/corewallet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # O serviço do Mongo às vezes ainda não aceitou conexões quando o job começa;
      # sem esperar, os testes da API falhavam com ECONNREFUSED.
      - name: Esperar o Mongo
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do sleep 1; done'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Esperar o Mongo
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do sleep 1; done'
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guardar os traços dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: |
          cp .env.example .env
          docker compose build
