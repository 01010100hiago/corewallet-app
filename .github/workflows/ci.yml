name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e build
    # Versão fixa da imagem do runner (o Mongo é tratado no passo "Subir o Mongo").
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URI: mongodb://localhost:27017/corewallet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # O Mongo sobe aqui, e não como "service", para dar para cair para outra versão: o Mongo 8 não
      # inicia em máquinas do GitHub com kernel Linux 6.19+ (SERVER-121912) e isso varia de máquina
      # para máquina. Tenta o 8 e, se ele não subir, usa o 7.0 (os testes só usam recursos comuns).
      - name: Subir o Mongo
        run: |
          for image in mongo:8 mongo:7.0; do
            docker rm -f mongo >/dev/null 2>&1 || true
            docker run -d --name mongo -p 27017:27017 "$image" >/dev/null
            for i in $(seq 1 30); do
              # ping de verdade: a porta abre antes de o Mongo estar pronto, e um contêiner que saiu falha aqui
              if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then echo "Mongo no ar: $image"; exit 0; fi
              sleep 1
            done
            echo "$image não subiu. Log:"
            docker logs mongo 2>&1 | tail -n 3
          done
          exit 1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Testes de ponta a ponta
    # Versão fixa da imagem do runner (o Mongo é tratado no passo "Subir o Mongo").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # O Mongo sobe aqui, e não como "service", para dar para cair para outra versão: o Mongo 8 não
      # inicia em máquinas do GitHub com kernel Linux 6.19+ (SERVER-121912) e isso varia de máquina
      # para máquina. Tenta o 8 e, se ele não subir, usa o 7.0 (os testes só usam recursos comuns).
      - name: Subir o Mongo
        run: |
          for image in mongo:8 mongo:7.0; do
            docker rm -f mongo >/dev/null 2>&1 || true
            docker run -d --name mongo -p 27017:27017 "$image" >/dev/null
            for i in $(seq 1 30); do
              # ping de verdade: a porta abre antes de o Mongo estar pronto, e um contêiner que saiu falha aqui
              if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then echo "Mongo no ar: $image"; exit 0; fi
              sleep 1
            done
            echo "$image não subiu. Log:"
            docker logs mongo 2>&1 | tail -n 3
          done
          exit 1
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guardar os traços dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7

  docker:
    name: Imagens Docker
    # Versão fixa da imagem do runner (o Mongo é tratado no passo "Subir o Mongo").
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: |
          cp .env.example .env
          docker compose build
