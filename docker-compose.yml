name: corewallet

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina no .env}
    volumes:
      - mongo-data:/data/db
    # Só o próprio computador acessa o banco (para rodar a API fora do Docker).
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/corewallet?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Cookie "Secure" só funciona em HTTPS. Use true quando for publicar.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Quantos proxies ficam entre o navegador e a API. O nginx do web entrega um IP só já resolvido,
      # então o valor é 1 (inclusive atrás de um túnel da Cloudflare, com REALIP_CONF no web).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Verificação automática do CoreWallet (usada quando não há chaves do Turnstile): vazios = padrão.
      CAPTCHA_POW: ${CAPTCHA_POW:-}
      POW_MAX_NUMBER: ${POW_MAX_NUMBER:-}
      # Login com Google e captcha da Cloudflare: vazios = desligados.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Envio de email (confirmação de cadastro). Vazios = sem envio e sem confirmação. Veja docs/CONFIGURACAO.md.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-}
      # Chave só do 2FA (opcional, 32+ caracteres). Sem ela, deriva do JWT_SECRET.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # "production" recusa as chaves de teste da Cloudflare. Para testar com elas
      # no seu computador, ponha NODE_ENV_API=development no .env.
      NODE_ENV: ${NODE_ENV_API:-production}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      # IP real da pessoa. Atrás de um túnel da Cloudflare: REALIP_CONF=./web/realip-cloudflare.conf no .env.
      - ${REALIP_CONF:-./web/realip-nenhum.conf}:/etc/nginx/realip/realip.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
