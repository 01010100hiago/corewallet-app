server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Além do próprio site: o botão do Google (Google Identity Services) e o captcha
# da Cloudflare (Turnstile). Cada origem liberada só para o que precisa.
  # O botão do Google injeta um <style> e um atributo style inline. Em vez de liberar
  # 'unsafe-inline' para a página toda, liberamos só estes dois hashes exatos.
  # Se o Google mudar o visual do botão, o console do navegador mostra o hash novo
  # ("Applying inline style violates...") e basta trocar aqui.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://accounts.google.com/gsi/style 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw=' 'unsafe-hashes' 'sha256-/NAzIV0UZjora6la1jgdDN9mQ1erpm0+Y2osWuSlG0Q='; script-src 'self' https://accounts.google.com/gsi/client https://challenges.cloudflare.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # A API manda os próprios cabeçalhos de segurança (helmet); um add_header
  # aqui impede o nginx de repetir os do bloco server.
  # DNS interno do Docker. O endereço da API é resolvido a cada 10 s, então
  # recriar o container da api não deixa o nginx apontando para o IP antigo.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    add_header X-Content-Type-Options "nosniff" always;
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
