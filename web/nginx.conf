server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # A API manda os próprios cabeçalhos de segurança (helmet); um add_header
  # aqui impede o nginx de repetir os do bloco server.
  # DNS interno do Docker. O endereço da API é resolvido a cada 10 s, então
  # recriar o container da api não deixa o nginx apontando para o IP antigo.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    add_header X-Content-Type-Options "nosniff" always;
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
