# Atrás de um túnel da Cloudflare (cloudflared): o IP da pessoa vem no cabeçalho CF-Connecting-IP, que a
# Cloudflare escreve sozinha (o que a pessoa mandar com esse nome é descartado por ela). O nginx só acredita
# nesse cabeçalho quando a conexão vem de uma rede privada (o cloudflared, pela rede interna do Docker);
# de qualquer outro lugar o cabeçalho é ignorado, e ninguém consegue se passar por outro IP.
# Com isto, use TRUST_PROXY=1: a API enxerga um único salto (o nginx), que entrega o IP já resolvido.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from fc00::/7;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
